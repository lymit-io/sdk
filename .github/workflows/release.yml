name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # create the Version Packages PR and git tags
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC) — no NPM_TOKEN anywhere

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      # No registry-url: setup-node would write a placeholder _authToken to .npmrc, which
      # makes npm authenticate with a bogus token instead of the OIDC exchange.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Trusted Publishing needs npm >= 11.5.1; Node 22 bundles an older npm.
      - run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
      - name: Version packages or publish
        uses: changesets/action@v1
        with:
          # Opens/updates the "Version Packages" PR while changesets are pending;
          # once that PR is merged (no pending changesets), publishes instead.
          version: pnpm changeset version
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
